# Conora DEV stack on a single EC2 (aarch64). Images come from ECR; secrets from Secrets Manager.
# Files .env (compose interpolation) and .env.app (application settings) are generated by generate-env.sh.
name: conora-aws

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: conora-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conora-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  conora-api:
    image: ${ECR_API:?ECR_API required}:latest
    container_name: conora-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.app
    expose:
      - "8080"

  conora-worker:
    image: ${ECR_WORKER:?ECR_WORKER required}:latest
    container_name: conora-worker
    restart: on-failure:10
    logging: *default-logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.app

  caddy:
    image: caddy:2-alpine
    container_name: conora-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rabbitmq-data:
  redis-data:
  caddy-data:
  caddy-config:
