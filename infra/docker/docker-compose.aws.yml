# Conora production stack on a single EC2 (aarch64). Resource names keep the prefix "dev".
# Images come from ECR; secrets from Secrets Manager. Local development does not use this file.
# Files .env (compose interpolation) and .env.app (application settings) are generated by generate-env.sh.
name: conora-aws

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  conora-api:
    image: ${ECR_API:?ECR_API required}:latest
    container_name: conora-api
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.app
    expose:
      - "8080"

  conora-worker:
    image: ${ECR_WORKER:?ECR_WORKER required}:latest
    container_name: conora-worker
    restart: on-failure:10
    logging: *default-logging
    env_file: .env.app

  caddy:
    image: caddy:2-alpine
    container_name: conora-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv/app:ro
      - ./public:/srv/public:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
