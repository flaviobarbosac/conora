name: conora

services:
  postgres:
    image: postgres:16-alpine
    container_name: conora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conora}
      POSTGRES_USER: ${POSTGRES_USER:-conora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conora_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - conora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conora} -d ${POSTGRES_DB:-conora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: conora-mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  conora_postgres_data:
