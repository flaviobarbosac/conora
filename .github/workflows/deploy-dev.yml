name: Deploy Develop API

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      dns_only:
        description: "Only restore Route53 DNS (skip build/deploy)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_SUFFIX: conora-dev

jobs:
  fix-dns:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dns_only }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Diagnose and restore Route53
        run: |
          chmod +x infra/scripts/fix-route53-dns.sh
          infra/scripts/fix-route53-dns.sh

      - name: Upload DNS summary
        uses: actions/upload-artifact@v4
        with:
          name: dns-fix-out
          path: /tmp/dns-out/
          if-no-files-found: warn

  test-build-deploy:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dns_only != true) && (github.event_name == 'workflow_dispatch' || vars.ENABLE_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Conora.slnx

      - name: Test
        run: dotnet test tests/Conora.UnitTests/Conora.UnitTests.csproj --configuration Release --no-restore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile \
            -t $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-api:latest \
            --push .

      - name: Build and push Worker image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.worker \
            -t $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-worker:latest \
            --push .

      - name: Deploy to EC2 via SSM
        shell: pwsh
        run: |
          ./infra/scripts/deploy-ssm.ps1 -Environment dev
