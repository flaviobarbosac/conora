name: Deploy Production API

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_SUFFIX: conora-dev

jobs:
  test-build-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Conora.slnx

      - name: Test
        run: dotnet test tests/Conora.UnitTests/Conora.UnitTests.csproj --configuration Release --no-restore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile \
            -t $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-api:latest \
            --push .

      - name: Build and push Worker image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.worker \
            -t $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-worker:latest \
            --push .

      - name: Deploy to EC2 via SSM
        shell: pwsh
        run: |
          ./infra/scripts/deploy-ssm.ps1 -Environment dev
