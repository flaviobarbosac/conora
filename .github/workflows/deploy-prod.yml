name: Deploy Production API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_SUFFIX: conora-prod

jobs:
  test-build-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Conora.slnx

      - name: Test
        run: dotnet test tests/Conora.UnitTests/Conora.UnitTests.csproj --configuration Release --no-restore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f Dockerfile -t $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-api:latest .
          docker push $ECR_REGISTRY/${{ env.ECR_SUFFIX }}-api:latest

      - name: Deploy to EC2 via SSM
        shell: pwsh
        run: |
          ./infra/scripts/deploy-ssm.ps1 -Environment prod
